# DOSBox-X: run the regression tests (tests\) with the DOS build; the result goes to dos\test.log.
# Build first with build-dos.conf. Run from this folder.
[sdl]
output = surface
[dosbox]
memsize = 512
[cpu]
cycles = max
[dos]
ver = 7.1
lfn = true
[autoexec]
mount c .
c:
set PATH=C:\dos
dos\runtests dos\wsconv.exe > dos\test.log
exit
