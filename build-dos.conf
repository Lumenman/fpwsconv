# DOSBox-X: build the DOS (go32v2) version with DOS Free Pascal in D:\Programs\FPCDOS (long file names on)
[sdl]
output = surface
[dosbox]
memsize = 512
[cpu]
cycles = max
[dos]
ver = 7.1
lfn = true
[autoexec]
mount c "D:\claude\wordstar\wsconvert"
mount f "D:\Programs\FPCDOS"
c:
set PATH=F:\bin\go32v2
call builddos.bat
exit
