# DOSBox-X: build the DOS (go32v2) version with DOS Free Pascal (long file names on).
# Run from this folder; change the "mount f" line to where dos322full.zip is unpacked.
[sdl]
output = surface
[dosbox]
memsize = 512
[cpu]
cycles = max
[dos]
ver = 7.1
lfn = true
[autoexec]
mount c .
mount f "D:\Programs\FPCDOS"
c:
set PATH=F:\bin\go32v2
call builddos.bat
exit
